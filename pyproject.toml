[project]
name = "dqc"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = [
    "simpy",
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "pyyaml",
    "torch",
    "pymetis",
    "streamlit",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
